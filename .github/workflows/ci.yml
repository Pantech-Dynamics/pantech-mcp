name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Until pantech-go v0.1.0 is published (and go.sum has it), build
      # against its main branch through a workspace outside the repo.
      - name: Use a pantech-go checkout if it is not published yet
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^github.com/Pantech-Dynamics/pantech-go ' go.sum; then
            echo "pantech-go comes from go.sum"; exit 0
          fi
          git clone --depth 1 https://github.com/Pantech-Dynamics/pantech-go "$RUNNER_TEMP/pantech-go"
          cat > "$RUNNER_TEMP/go.work" <<WORK
          go 1.25.0
          use $GITHUB_WORKSPACE
          use $RUNNER_TEMP/pantech-go
          replace github.com/Pantech-Dynamics/pantech-go v0.1.0 => $RUNNER_TEMP/pantech-go
          WORK
          echo "GOWORK=$RUNNER_TEMP/go.work" >> "$GITHUB_ENV"

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test -race ./...

      # Every platform we release must still build.
      - run: make dist VERSION=ci

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build context for an unpublished pantech-go
        id: sdk
        shell: bash
        run: |
          if grep -q '^github.com/Pantech-Dynamics/pantech-go ' go.sum; then
            echo "contexts=" >> "$GITHUB_OUTPUT"
          else
            git clone --depth 1 https://github.com/Pantech-Dynamics/pantech-go "$RUNNER_TEMP/pantech-go"
            echo "contexts=pantech-go=$RUNNER_TEMP/pantech-go" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: ${{ steps.sdk.outputs.contexts }}
          push: false
          build-args: VERSION=ci
