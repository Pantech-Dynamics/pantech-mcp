name: Release

# Push a tag to release:  git tag v0.1.0 && git push origin v0.1.0
# A tag with a hyphen (v0.2.0-rc.1) is published as a pre-release and the
# image is not tagged latest.

on:
  push:
    tags: ["v*"]
  # Called by auto-release.yml when a push to main adds a new version to
  # CHANGELOG.md. A tag pushed by that workflow cannot trigger this one
  # itself (GitHub never starts workflows from GITHUB_TOKEN pushes), so it
  # calls this workflow directly with the version it tagged.
  workflow_call:
    inputs:
      version:
        description: The tag to release, such as v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: CHANGELOG.md has this version
        run: |
          case "$VERSION" in
            *-*) echo "a pre-release: no changelog section needed" ;;
            *) grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section: add it on main, then tag again"; exit 1; } ;;
          esac

      - name: pantech-go is published
        run: |
          grep -q '^github.com/Pantech-Dynamics/pantech-go ' go.sum || {
            echo "::error::go.sum has no pantech-go: publish pantech-go first, then go get github.com/Pantech-Dynamics/pantech-go@v0.1.0 && go mod tidy here"; exit 1; }

      - run: go test -race ./...

      - run: make dist VERSION=$VERSION

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $VERSION " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $VERSION" > notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; *) flags="--latest" ;; esac
          gh release create "$VERSION" dist/$VERSION/* --title "$VERSION" --notes-file notes.md --verify-tag $flags

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          image=ghcr.io/pantech-dynamics/pantech-mcp
          tags="$image:${VERSION#v}"
          case "$VERSION" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=pantech-mcp
            org.opencontainers.image.description=Pantech Dynamics MCP server
